name: Merge check

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5  # 5 minutes for entire job (setup + tests with 90s timeout each)
    
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci
      timeout-minutes: 2

    - name: Run type check
      run: npm run typecheck
      timeout-minutes: 1

    - name: Run tests
      run: npm test
      timeout-minutes: 2  # Tests have 90s timeout each, 2 minutes should be enough